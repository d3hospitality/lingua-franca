# Runs the alias↔build loud-fail regression canary (check-alias-guard.sh) on every
# push/PR so a silent revert of the "fail loudly when VERCEL_TOKEN lapsed on a
# prod-deployed dispatch" branch in smoke-prod-live.yml is caught in review —
# instead of relying on a human to run the canary by hand. Triggers on changes to
# either the guard scripts OR smoke-prod-live.yml itself (where a revert would land).
name: alias-guard-check

on:
  push:
    # Scoped to the default branch ONLY. The pull_request trigger below already
    # runs on every PR (it's the required gate), so a push trigger on PR feature
    # branches just duplicates that run — two identical ~seconds jobs per PR that
    # touches these paths, wasting Actions minutes. Restricting push to main keeps
    # the one case pull_request can't see — a direct-to-main commit that bypasses a
    # PR (admin merge, hotfix push) — while dropping the redundant PR-branch run.
    branches:
      - main
    paths:
      - 'lingua-franca-api/scripts/**'
      - '.github/workflows/smoke-prod-live.yml'
      - '.github/workflows/alias-guard-check.yml'
  # Runs on EVERY PR to main (no path filter) — this check is a required status
  # gate via branch protection, and a path-filtered required check hangs forever
  # as "Expected — waiting for status to be reported" on PRs that don't touch the
  # filtered paths. The guard is self-contained (no secrets/network, ~seconds) so
  # running it on every PR is cheap and keeps the gate from blocking unrelated PRs.
  pull_request:
  workflow_dispatch:

jobs:
  check-alias-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships bash + GNU grep; assert they resolve so a missing dep
      # fails loudly rather than the guard skipping silently.
      - name: Verify guard deps resolve on Linux
        run: command -v bash && command -v grep

      # The guard exits non-zero if the alias↔build step can no longer fail loudly
      # on a lapsed VERCEL_TOKEN — i.e. if the loud-fail branch was reverted.
      - name: Run alias↔build loud-fail guard
        run: bash scripts/check-alias-guard.sh

      # Asserts this workflow's own triggers stay single-run-per-PR: push scoped
      # to main, push.paths still watches the guard scripts, and pull_request
      # carries no path filter (so the required gate can't hang). Catches a
      # silent re-broadening of the triggers that would double-run every PR or
      # block unrelated ones.
      - name: Run trigger-topology guard
        run: bash scripts/check-trigger-topology.sh
