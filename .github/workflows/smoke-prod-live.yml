# Post-deploy LIVE smoke gate for lingua-franca-api. Where fixture-check.yml proves
# the OFFLINE half (the committed long-en.b64 decodes on Linux), THIS workflow runs
# the FULL scripts/smoke-test.sh — including the [3] live transcribe round-trip — against
# the real deployed endpoint after every production deploy. On a GitHub-hosted ubuntu
# runner there is no macOS `say`/`afconvert`, so [3] automatically falls back to the
# committed fixture: a genuine ~38.8s / 114-word audio POST to /api/transcribe that
# verifies the vercel.json maxDuration=60 limit does NOT truncate long Whisper/Deepgram
# transcriptions. This is the live truncation guard the offline check can't give us.
#
# Cost note: [2] and [3] make real paid GPT + Whisper/Deepgram calls against prod
# (a few cents/run). It runs once per production deploy + a daily canary, not per push.
# Registration note 2026-06-26: this workflow was originally created (commit 5679cc5)
# as a dispatch-only file with NO push trigger, which poisoned its trigger index on
# GitHub — `repository_dispatch`/`workflow_dispatch` events returned 422 "workflow
# does not have trigger" even after later adding a scoped push gate. Renaming the file
# (smoke-prod.yml -> smoke-prod-live.yml) forces a brand-new workflow registration that
# has the push trigger present FROM CREATION, so all triggers index cleanly. Dispatch
# matches by event_type across any filename, so deploy.sh's prod-deployed hook is unaffected.
name: smoke-prod

on:
  # PRIMARY trigger. This Vercel project deploys via the CLI (`npx vercel --prod`),
  # NOT the GitHub app — verified: the project has no GitHub `link` and GitHub's
  # deployments API shows zero Vercel deploys (only github-pages). So Vercel never
  # emits a `deployment_status` here. Instead, lingua-franca-api/deploy.sh fires a
  # `repository_dispatch` (event_type: prod-deployed) with the live URL in
  # client_payload after a successful prod deploy. That is what gates this live smoke.
  repository_dispatch:
    types: [prod-deployed]
  # Self-gate on edits to this workflow file. Two reasons: (1) a dispatch-only
  # workflow (no push/PR trigger) is NOT indexed or dispatchable on GitHub until a
  # push/PR event first associates it on the default branch — this push trigger is
  # what registers it; (2) it re-runs the live smoke whenever the gate itself
  # changes, so a broken edit is caught immediately. Scoped to this one file, so the
  # paid run only fires on the rare occasion the smoke definition is edited.
  push:
    paths:
      - '.github/workflows/smoke-prod-live.yml'
  # Kept for the day this project is linked to the Vercel GitHub app — then real
  # deployment_status events flow and the success/Production guard below applies.
  deployment_status:
  # Manual re-run from the Actions tab against the default prod alias.
  workflow_dispatch:
  # Daily canary: catches prod regressions that aren't tied to a deploy — expired
  # API keys, upstream Whisper/Deepgram outages, Vercel function timeouts.
  schedule:
    - cron: '17 13 * * *'   # 13:17 UTC daily

# Only one live smoke per ref at a time — avoid stacking paid runs on rapid deploys.
concurrency:
  group: smoke-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    # Skip preview deploys and failed deploys; run for manual/scheduled triggers.
    if: >
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment_status.environment == 'Production')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v4

      # smoke-test.sh needs curl + python3; both ship on ubuntu-latest. Assert so a
      # missing dep fails loudly instead of silently degrading a check to a skip.
      - name: Verify smoke deps resolve on Linux
        run: command -v bash && command -v curl && command -v python3 && command -v base64

      # Prefer the exact URL the deploy just produced: client_payload.url from the
      # CLI deploy hook (repository_dispatch), or environment_url from a real Vercel
      # deployment_status. Otherwise fall back to the stable prod alias (covers
      # workflow_dispatch + the daily scheduled canary).
      - name: Resolve target URL
        id: target
        env:
          PAYLOAD_URL: ${{ github.event.client_payload.url }}
          DEPLOY_ID: ${{ github.event.client_payload.deploy_id }}
          DEPLOY_DPL: ${{ github.event.client_payload.deploy_dpl }}
          PAYLOAD_SRC: ${{ github.event.client_payload.source }}
          STATUS_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          # Provenance: prove WHERE the target URL came from so a green run can't
          # masquerade as "the loop works" when it actually fell back to the default.
          if [ -n "$PAYLOAD_URL" ]; then
            URL="$PAYLOAD_URL"; ORIGIN="repository_dispatch client_payload (real CLI deploy)"
          elif [ -n "$STATUS_URL" ]; then
            URL="$STATUS_URL"; ORIGIN="deployment_status environment_url (Vercel GitHub app)"
          else
            URL="https://lingua-franca-api.vercel.app"; ORIGIN="hardcoded fallback (manual/canary — NOT a deploy-triggered run)"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Smoke target: $URL"
          echo "Target origin: $ORIGIN"
          echo "Deploy marker: deploy_id=${DEPLOY_ID:-<none>} deploy_dpl=${DEPLOY_DPL:-<none>} source=${PAYLOAD_SRC:-<none>}"
          echo "deploy_dpl=${DEPLOY_DPL}" >> "$GITHUB_OUTPUT"
          # Surface it in the run summary so the deploy.sh closer can correlate at a glance.
          {
            echo "### smoke-prod target"
            echo "- **URL:** \`$URL\`"
            echo "- **Origin:** $ORIGIN"
            echo "- **deploy_id:** \`${DEPLOY_ID:-<none>}\` · **deploy_dpl:** \`${DEPLOY_DPL:-<none>}\` · **source:** \`${PAYLOAD_SRC:-<none>}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          # A prod-deployed dispatch MUST carry a URL — if it doesn't, the loop is
          # broken (deploy.sh failed to populate client_payload) and we fail loudly
          # rather than silently smoking the fallback and reporting a false green.
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ -z "$PAYLOAD_URL" ]; then
            echo "::error::prod-deployed dispatch arrived with no client_payload.url — deploy.sh notify_ci is broken"
            exit 1
          fi

      # Mirror of deploy.sh's local "1b" check, on the clean Linux runner. deploy.sh
      # proves the public alias serves the EXACT build it just shipped (via
      # verify-alias.sh), but that assertion only runs on the deploying machine — the
      # alias could still drift (or never finish promoting) by the time this gate
      # runs, and the live smoke below would then validate a stale-but-healthy
      # deployment and report a false green. This step re-runs the SAME assertion
      # here, pinning the alias to the dispatched build's dpl_ id, so a green smoke
      # provably tested THIS deploy — not just "a healthy URL".
      #
      # Reuses scripts/verify-alias.sh verbatim (single source of truth). It needs
      # `vercel inspect`, so a VERCEL_TOKEN secret must be present; the token must
      # belong to the team that owns the deployment. Graceful degradation, matching
      # how deploy.sh treats a verify-alias prereq miss (warn, continue — the live
      # smoke still runs and still gates the deploy):
      #   • no deploy_dpl in payload (manual run / daily canary, or a deploy.sh too
      #     old to send it) → nothing to pin against → skip.
      #   • no VERCEL_TOKEN secret → can't inspect → skip (with a nudge to add it).
      #   • verify-alias exit 2 (prereq/unresolvable) → warn, continue.
      #   • verify-alias exit 1 (alias serves a DIFFERENT dpl) → FAIL the job before
      #     the live smoke can validate the wrong build.
      - name: Assert alias serves the dispatched build (alias↔build)
        env:
          DEPLOY_DPL: ${{ steps.target.outputs.deploy_dpl }}
          URL: ${{ steps.target.outputs.url }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          note() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }
          echo "### alias↔build assertion" >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$DEPLOY_DPL" ]; then
            note "- ⏭️ skipped: no \`client_payload.deploy_dpl\` (manual/canary run, or a deploy.sh predating this field) — no specific build to pin the alias to."
            exit 0
          fi
          if [ -z "$VERCEL_TOKEN" ]; then
            # [QA throwaway] Loud-fail branch deliberately weakened to a silent skip
            # so check-alias-guard catches the revert and goes RED. Do NOT merge.
            note "- ⚠️ skipped: \`VERCEL_TOKEN\` secret not set — cannot run \`vercel inspect\`. (Live smoke below still runs.)"
            exit 0
          fi
          export VERCEL_TOKEN
          # Retries a touch higher than the local default: a runner can start before
          # alias promotion has fully propagated. dpl_ id is passed as arg 1 so
          # verify-alias skips re-inspecting it and only polls the alias side.
          if bash scripts/verify-alias.sh "$DEPLOY_DPL" "$URL" --retries 8 --delay 5; then
            note "- ✅ alias \`$URL\` serves the dispatched build \`$DEPLOY_DPL\` — the live smoke tests the exact deploy, not a stale one."
          else
            rc=$?
            if [ "$rc" -eq 1 ]; then
              note "- ❌ alias \`$URL\` does NOT serve \`$DEPLOY_DPL\` — it points at a different (stale) deployment. Failing before the live smoke validates the wrong build."
              echo "::error::alias↔build mismatch — $URL is not serving dispatched dpl $DEPLOY_DPL"
              exit 1
            fi
            note "- ⚠️ verify-alias prereq failure (exit $rc) — could not prove the alias↔build link (no vercel CLI, token scope, or unresolvable id). Continuing; live smoke still runs."
          fi

      # Full live gate: [1] routing/validation, [2] /api/suggest, [3] live transcribe
      # round-trip against the deployed endpoint. Non-zero exit fails the job and so
      # surfaces a bad production deploy as a red check.
      - name: Run live smoke gate (incl. [3] transcribe round-trip)
        run: bash scripts/smoke-test.sh "${{ steps.target.outputs.url }}"
