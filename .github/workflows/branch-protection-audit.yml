# Daily audit that the merge gate on main is STILL live — in BOTH dimensions:
#
#   1. CONFIGURATION (job: audit-branch-protection) — the required contexts
#      check-alias-guard + check-fixture are still LISTED in main's branch
#      protection. Needs admin read (PAT secret BRANCH_PROTECTION_PAT).
#   2. BEHAVIOUR (job: audit-merge-gate) — the merge button on every OPEN PR
#      actually HONOURS those contexts: no PR is CLEAN-while-red, and no required
#      check has silently stopped running. Needs only the default GITHUB_TOKEN.
#
# Why both: the topology guard (check-trigger-topology.sh, run by
# alias-guard-check.yml) locks the workflow YAML so the jobs keep firing once per
# PR, but it is blind to branch protection AND to live merge state. A context can
# be silently dropped from main's required list (job 1 catches that), OR the merge
# button can go CLEAN while a required check is red / absent (job 2 catches that)
# — the config being correct does not prove the gate fires. Running both daily
# surfaces a silently-dead gate, in either dimension, within 24h.
name: branch-protection-audit

on:
  schedule:
    # 13:17 UTC daily — off the top of the hour to dodge Actions cron congestion.
    - cron: '17 13 * * *'
  workflow_dispatch:
  # Scoped push so this workflow INDEXES (a dispatch/schedule-only workflow won't
  # register until a push/PR associates it — memory: github-dispatch-only-workflow-
  # registration) and so edits to the guard itself are smoke-tested on landing.
  push:
    branches:
      - main
    paths:
      - 'lingua-franca-api/scripts/check-branch-protection.sh'
      - 'lingua-franca-api/scripts/check-required-checks-topology.sh'
      - 'lingua-franca-api/scripts/check-merge-gate.sh'
      - 'lingua-franca-api/scripts/check-merge-gate-all.sh'
      - 'lingua-franca-api/scripts/check-schedule-fired.sh'
      - 'lingua-franca-api/scripts/check-schedule-fired.selftest.sh'
      - 'lingua-franca-api/scripts/check-proof-armed.sh'
      - 'lingua-franca-api/scripts/run-saga-selftests.sh'
      - 'lingua-franca-api/scripts/run-saga-selftests.selftest.sh'
      - '.github/workflows/branch-protection-audit.yml'
      - '.github/workflows/schedule-fired-proof.yml'

jobs:
  audit-branch-protection:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v5

      # exit 0 = gate live (pass) · exit 1 = context dropped (FAIL the job) ·
      # exit 2 = inconclusive, e.g. PAT secret absent (neutral warning, don't fail
      # — a missing secret or API blip must not page as a real regression).
      - name: Assert check-alias-guard and check-fixture are required status checks
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
        run: |
          set +e
          bash scripts/check-branch-protection.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=branch-protection-audit::Inconclusive (exit 2) — likely BRANCH_PROTECTION_PAT secret is unset or lacks admin:repo read. Gate NOT verified."
            exit 0
          fi
          exit $rc

  # SELF-EXTENDING TOPOLOGY GUARD: audit-branch-protection (above) proves the
  # required contexts are LISTED; this proves each one's WORKFLOW is trigger-clean
  # AND that strict mode is on. The per-workflow topology step embedded in
  # alias-guard-check.yml / fixture-check.yml only locks the TWO workflows that
  # carry it — nothing forces a FUTURE 3rd required check to self-lock. This job
  # derives the work-list from the LIVE required contexts and runs the topology
  # guard against EACH, so a new required check whose workflow is path-filtered on
  # pull_request (the exact hang that forced #14/#17 admin bypasses) is caught
  # within 24h instead of when an unrelated PR first hangs. Also asserts strict=true
  # so a silent flip back to non-strict (stale-base merges) is surfaced. Needs the
  # same admin read as audit-branch-protection → BRANCH_PROTECTION_PAT.
  audit-required-checks-topology:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v5

      # exit 0 = strict on + every required check topology-clean (pass) ·
      # exit 1 = strict off, a required context maps to no workflow, or a required
      #          check's workflow is path-filtered/double-running (FAIL — a real hole) ·
      # exit 2 = inconclusive, e.g. PAT absent or API blip (neutral warning, don't page).
      - name: Assert every required check is topology-clean and strict mode is on
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
        run: |
          set +e
          bash scripts/check-required-checks-topology.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=audit-required-checks-topology::Inconclusive (exit 2) — likely BRANCH_PROTECTION_PAT secret is unset or lacks admin:repo read. Topology+strict NOT verified."
            exit 0
          fi
          exit $rc

  # BEHAVIOURAL half: sweep every OPEN PR and assert the merge button actually
  # honours the required checks (no CLEAN-while-red, no required check that quietly
  # stopped running). Uses only the default GITHUB_TOKEN — reading PR merge state
  # needs no admin rights — so unlike job 1 above it can never be inconclusive for
  # lack of a PAT. Runs independently of audit-branch-protection so a failure in
  # one dimension still surfaces the other.
  audit-merge-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v5

      # exit 0 = every open PR's gate is consistent (or no open PRs) ·
      # exit 1 = a DEAD/defective gate on some PR (FAIL the job — investigate now) ·
      # exit 2 = inconclusive (gh/API blip) → neutral warning, don't page as a regression.
      - name: Sweep all open PRs — assert the merge button honours every required check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bash scripts/check-merge-gate-all.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=audit-merge-gate::Inconclusive (exit 2) — gh/API was unreachable or unauthenticated. Behavioural gate NOT verified this run."
            exit 0
          fi
          exit $rc

  # OFFLINE LOGIC GUARD: the cron verifier check-schedule-fired.sh has only ever
  # executed its PENDING/exit-2 path in the wild (until the 13:17 UTC tick fires
  # green on main, its success/regression branches never run). This job runs the
  # self-test harness, which stubs `gh` on PATH and drives ALL 8 exit paths
  # (0=green, 1=regression, 2=inconclusive) offline — so a stealth edit that
  # flips e.g. a `!=` to `==` and lets a RED unattended run read as PASS is caught
  # in CI on landing, not weeks later in a silent audit rot. Needs NO token and NO
  # network (only the real jq, preinstalled on ubuntu-latest): it can never be
  # inconclusive, so any non-zero here is a true logic regression — fail the job.
  selftest-schedule-verifier:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v5

      # exit 0 = all 8 stubbed exit-path scenarios behave as specified ·
      # exit 1 = check-schedule-fired.sh's exit logic drifted (FAIL — a regression) ·
      # exit 2 = jq unavailable (harness skipped). jq ships on ubuntu-latest, so
      # treat exit 2 as an environment fault worth surfacing, but don't page it as
      # a logic regression — emit a neutral warning and pass.
      - name: Self-test the schedule-fired cron verifier offline (all exit paths)
        run: |
          set +e
          bash scripts/check-schedule-fired.selftest.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=selftest-schedule-verifier::Inconclusive (exit 2) — jq was unavailable on the runner, so the harness was skipped. Verifier logic NOT proven this run."
            exit 0
          fi
          exit $rc

  # PRE-FLIGHT WIRING GUARD: the two cron checks above prove LOGIC (selftest) and,
  # at the tick, that the cron ACTUALLY FIRED green (check-schedule-fired.sh, run by
  # schedule-fired-proof.yml at 13:30). Neither asserts — BEFORE the tick — that the
  # live apparatus is still wired so the one-time wall-clock proof isn't wasted on a
  # false-fail: a workflow GitHub disabled for repo inactivity, a job renamed out
  # from under the verifier's JOBS default, the proof de-indexed, or the proof tick
  # reordered ahead of the audit. check-proof-armed.sh asserts all of that against
  # the LIVE repo + default-branch workflow copies every run, at any hour. Reading
  # workflow state needs only actions:read, which the default GITHUB_TOKEN has — so
  # like audit-merge-gate it never needs a PAT. This job is itself one of the four
  # the verifier enforces (memory: check-schedule-fired-cron-verifier), closing the
  # loop: the pre-flight guard is covered by the same tick it protects.
  audit-proof-armed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v5

      # exit 0 = apparatus armed (pass) · exit 1 = mis-wired, a real regression that
      # would waste/false the next proof (FAIL the job) · exit 2 = inconclusive
      # (gh/jq missing, API blip, or a workflow file absent) → neutral warning, never
      # paged as a regression.
      - name: Assert the cron-proof apparatus is armed for the next tick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          bash scripts/check-proof-armed.sh
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=audit-proof-armed::Inconclusive (exit 2) — gh/jq unavailable, API blip, or a workflow file absent. Pre-flight wiring NOT verified this run."
            exit 0
          fi
          exit $rc

  # WHOLE-APPARATUS ROLL-UP: the five jobs above each guard ONE dimension. This one
  # asks the single pre-tick question no individual job answers — "is EVERY cron-proof
  # guard's offline self-test still green right now?" run-saga-selftests.sh auto-discovers
  # every scripts/*.selftest.sh, runs each in isolation, and emits one roll-up verdict, so
  # a refactor that silently breaks one guard's self-test (hidden behind the others' greens)
  # is caught in CI on landing rather than weeks later. Auto-discovery means any FUTURE saga
  # self-test is covered the instant it lands — no edit to this workflow required. The saga
  # self-tests stub `gh` on PATH and need only the real jq (preinstalled on ubuntu-latest):
  # NO token, NO network — so this job can never be inconclusive for lack of a secret, and
  # any non-zero exit is a true regression. It is itself one of the *.selftest.sh discovered,
  # closing the loop: the roll-up runner's own self-test runs inside the roll-up it powers.
  selftest-saga-aggregate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lingua-franca-api
    steps:
      - uses: actions/checkout@v5

      # exit 0 = every discovered saga self-test passed (pass) ·
      # exit 1 = at least one self-test failed — a true logic regression (FAIL the job) ·
      # exit 2 = NOTHING FOUND: zero *.selftest.sh discovered (wrong dir / broken checkout).
      # That is never a silent green, but it is an environment fault, not a logic
      # regression — emit a neutral warning and pass so a flaky checkout can't page.
      - name: Roll up every cron-proof guard's offline self-test into one verdict
        run: |
          set +e
          bash scripts/run-saga-selftests.sh --quiet
          rc=$?
          if [ "$rc" -eq 2 ]; then
            echo "::warning title=selftest-saga-aggregate::Inconclusive (exit 2) — no *.selftest.sh discovered, likely a broken checkout or moved scripts dir. Apparatus roll-up NOT verified this run."
            exit 0
          fi
          exit $rc
